name: Deploy to Cloudflare

# Deploys VTGrab from GitHub, so the Cloudflare account resources
# (D1 + R2 + Queues) do not have to be created by hand.
#
# One-time setup (in GitHub, never in the chat):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     CLOUDFLARE_API_TOKEN  = a Cloudflare API token with
#       Account: Account Settings (Read), Workers Scripts (Edit),
#                Workers R2 Storage (Edit), D1 (Edit), Queues (Edit)
#       User:    User Details (Read), Memberships (Read)
#
# The account id is not a secret; CLOUDFLARE_ACCOUNT_ID only has to be set when
# the token belongs to more than one account.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: provision, migrate, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The account id is not a secret. The default is this project's account;
      # set the secret only when the token belongs to a different one.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '49aa874b448d5c449420248bb378f2be' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Provision D1 / R2 / Queues (idempotent)
        run: npm run cf:provision

      - name: Apply D1 migrations to the remote database
        run: npm run db:migrate

      - name: Build and deploy
        run: npm run deploy

      # The first run replaces the template D1 id. Commit it back so that
      # Cloudflare Workers Builds (the Git integration in the dashboard) can
      # deploy the same configuration as well. `[skip ci]` keeps this from
      # re-triggering this workflow.
      - name: Persist the real database_id in wrangler.jsonc
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- wrangler.jsonc; then
            echo "wrangler.jsonc unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit -m "chore: use the real vtgrab-db database_id [skip ci]"
          git push
